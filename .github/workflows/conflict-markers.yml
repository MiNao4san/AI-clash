name: conflict-markers-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if merge conflict markers exist
        run: |
          if rg -n "^(<<<<<<<|=======|>>>>>>>)" .; then
            echo "Merge conflict markers were found. Resolve conflicts before merging."
            exit 1
          fi
          echo "No merge conflict markers found."
